services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:17
    container_name: firepin-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:?DATABASE_USER is required} -d ${DATABASE_NAME:?DATABASE_NAME is required}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # =========================
  # Adminer
  # =========================
  adminer:
    image: adminer:latest
    container_name: firepin-adminer
    restart: unless-stopped

    environment:
      ADMINER_DEFAULT_SERVER: postgres

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


  # =========================
  # FastAPI
  # =========================
  api:
    build:
      context: ./FirePinAPI
      dockerfile: Dockerfile

    container_name: firepin-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./FirePinAPI:/app
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy


# =========================
# Volumes
# =========================
volumes:
  postgres_data:
  uploads_data:
